[project]
name = "tj-agents-core"
version = "0.1.0"
description = "Common agent behavior, engineering process and machine utilities for tj-agents"
requires-python = ">=3.12"
dependencies = [
    "tj-cli",
]

[tool.uv]
package = false

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli", rev = "f2bdde9a4705c9455e10d5bb044dca5e1f25b2a3", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
extend-exclude = ["plugins"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true
files = [".agents", ".codex/adapters", "scripts", "tests"]
exclude = ["^plugins/"]

[tool.pytest]
strict = true
testpaths = ["tests", ".agents/hooks/tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]
