[project]
name = "tj-agents-core"
version = "0.1.0"
description = "Common agent behavior, engineering process and machine utilities for tj-agents"
requires-python = ">=3.12"
dependencies = ["tj-base", "tj-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/tj-base"]

[tool.uv.sources]
tj-base = { workspace = true }
tj-cli = { git = "https://github.com/tj-agents/cli", rev = "92e29a7589a5dcf462af36d960684e49146d9d3b", subdirectory = "packages/tj-cli" }

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.1.1", "ruff>=0.17.4", "pytest-socket>=0.7.0"]

[tool.ruff]
extend-exclude = ["plugins"]

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "exhaustive-match"]
strict = true
warn_unreachable = true
files = [".agents", "scripts", "tests", ".codex/runtime", "packages"]
explicit_package_bases = true
mypy_path = [".agents/hooks/tests"]
exclude = ["^plugins/"]

[tool.pytest]
strict = true
pythonpath = ["."]
testpaths = ["tests", ".agents/hooks/tests"]
addopts = ["--import-mode=importlib", "-ra", "--disable-socket"]
filterwarnings = ["error"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

