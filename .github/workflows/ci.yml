name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: generated output stays out of pull requests
        run: python3 -B scripts/check_generated_paths.py --base "origin/${{ github.base_ref }}"

  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate the workspace from authored sources
        shell: pwsh
        run: |
          python -B scripts/update_catalog_digests.py
          ./.agents/sync-generated.ps1

      - name: generated files are current
        shell: pwsh
        run: ./.agents/sync-generated.ps1 -Check

      - name: tier payloads conform to the shipped shape
        shell: pwsh
        run: python -B .agents/hooks/check_tier_payload.py --root .

      - name: local capability catalog digests are current
        shell: pwsh
        run: python -B scripts/update_catalog_digests.py --check

      - name: harness declarations cover authored sources
        shell: pwsh
        run: python -B scripts/sync_harness_manifests.py --check

      - name: CLI session recovery tests
        shell: powershell
        run: ./cli-session-recovery/tests/cli-session-vault.tests.ps1

      - name: skill packaging tests
        shell: pwsh
        run: ./tests/skill-packaging.tests.ps1

      - name: continuation scheduler tests
        shell: pwsh
        run: ./tests/delivery-continuation.tests.ps1

      - name: handoff launcher tests
        shell: pwsh
        run: ./tests/handoff-launchers.tests.ps1

      - name: Codex marketplace startup sync tests
        shell: pwsh
        run: ./tests/codex-marketplace-sync.tests.ps1
      - name: Codex terminal profile tests
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p test_codex_terminal_profile.py
          ./tests/codex-terminal-profile.tests.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/codex-terminal-profile.tests.ps1

      - name: source layout and package tests
        shell: pwsh
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: shared runtime tests
        shell: pwsh
        run: python -B -m unittest discover -s .agents/hooks/tests -p 'test_*.py' -v

  regenerate:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: regenerate-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: regenerate committed packages from authored sources
        shell: pwsh
        run: |
          python -B scripts/update_catalog_digests.py
          ./.agents/sync-generated.ps1

      - name: verify the regenerated tree
        shell: pwsh
        run: |
          ./.agents/sync-generated.ps1 -Check
          python -B .agents/hooks/check_tier_payload.py --root .
          python -B scripts/update_catalog_digests.py --check
          python -B scripts/sync_harness_manifests.py --check

      - name: commit and push the regeneration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/catalog/catalog.json plugins .agents/plugins/marketplace.json .claude-plugin/marketplace.json CAPABILITIES.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Regenerate packages for $env:GITHUB_SHA"
            git push origin HEAD:main
            python -B scripts/update_catalog_digests.py --check --source base-agents=. --source-revision base-agents=HEAD
          } else {
            "Generated output already current."
          }
