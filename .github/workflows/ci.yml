name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: generated files are current
        shell: pwsh
        run: ./.agents/sync-generated.ps1 -Check

      - name: CLI session recovery tests
        shell: powershell
        run: ./cli-session-recovery/tests/cli-session-vault.tests.ps1