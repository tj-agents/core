name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: selection
        name: select affected validation
        run: python3 -B scripts/ci_selection.py select

  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: generated output stays out of pull requests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -B scripts/check_generated_paths.py --base "origin/${BASE_REF}"

  guidance-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: tj-agents/template
          ref: main
          path: .template
          persist-credentials: false

      - name: changed authored guidance has concrete examples (pull request)
        if: github.event_name == 'pull_request'
        run: python3 -B .template/.agents/template/utility/check/scripts/check_examples.py --root . --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --merge-base

      - name: changed authored guidance has concrete examples (default push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 -B .template/.agents/template/utility/check/scripts/check_examples.py --root . --base "${{ github.event.before }}" --head "${{ github.sha }}"

  verify-windows:
    needs: select
    if: needs.select.outputs.plan != '' && fromJSON(needs.select.outputs.plan).mode != 'docs'
    runs-on: windows-latest
    env:
      CI_SELECTION: ${{ needs.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        with:
          repository: tj-agents/template
          ref: main
          path: .template
          persist-credentials: false
      - uses: actions/checkout@v4
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        with:
          repository: tj-agents/react
          path: .react
          persist-credentials: false
      - uses: actions/checkout@v4
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        with:
          repository: tj-agents/dotnet
          path: .dotnet
          persist-credentials: false

      - name: regenerate the workspace from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/update_catalog_digests.py
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: generated files are current
        shell: pwsh
        run: ./.agents/sync-generated.ps1 -Check

      - name: tier payloads conform to the shipped shape
        shell: pwsh
        run: python -B .agents/hooks/check_tier_payload.py --root .

      - name: local capability catalog digests are current
        shell: pwsh
        run: python -B scripts/update_catalog_digests.py --check

      - name: harness declarations cover authored sources
        shell: pwsh
        run: python -B scripts/sync_harness_manifests.py --check

      - name: native host startup and discovery acceptance
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $native = Join-Path $env:RUNNER_TEMP 'tj-agents-native-acceptance'
          $codexRoot = Join-Path $native 'codex'
          $archive = Join-Path $native 'codex.zip'
          $claudeRoot = Join-Path $native 'claude'
          $tools = Join-Path $native 'tools'
          New-Item -ItemType Directory -Force -Path $native, $codexRoot, $claudeRoot, $tools | Out-Null
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/openai/codex/releases/tags/rust-v0.163.0-alpha.1'
          $asset = @($release.assets | Where-Object { $_.name -eq 'codex-x86_64-pc-windows-msvc.exe.zip' })
          if ($asset.Count -ne 1 -or -not $asset[0].digest) { throw 'Codex release asset metadata is incomplete.' }
          Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile $archive
          $actual = 'sha256:' + (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset[0].digest) { throw 'Codex release asset digest does not match metadata.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $codexRoot
          $codexSource = Get-ChildItem -LiteralPath $codexRoot -Filter 'codex-x86_64-pc-windows-msvc.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $codexSource) { throw 'Codex release did not contain its Windows executable.' }
          $codex = Join-Path $tools 'codex.exe'
          Copy-Item -LiteralPath $codexSource -Destination $codex
          npm install --prefix $claudeRoot --no-audit --no-fund '@anthropic-ai/claude-code@2.1.282'
          $claudeSource = Get-ChildItem -LiteralPath (Join-Path $claudeRoot 'node_modules/@anthropic-ai/claude-code/bin') -Filter claude.exe -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $claudeSource) { throw 'Claude package did not contain claude.exe.' }
          $claude = Join-Path $tools 'claude.exe'
          Copy-Item -LiteralPath $claudeSource -Destination $claude
          python -B scripts/native_host_acceptance.py --root . --marketplace . --codex $codex --claude $claude --artifacts (Join-Path $native 'artifacts')

      - name: authored skill references resolve in the public corpus
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: python -B .template/.agents/template/utility/check/scripts/check_skill_references.py --root . --root .template --root .react --root .dotnet --source-root .

      - name: CLI session recovery tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: powershell
        run: ./cli-session-recovery/tests/cli-session-vault.tests.ps1

      - name: skill packaging tests
        shell: pwsh
        run: ./tests/skill-packaging.tests.ps1

      - name: PowerShell host compatibility tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: |
          ./tests/powershell-host-compat.tests.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/powershell-host-compat.tests.ps1

      - name: continuation scheduler tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: |
          ./tests/delivery-continuation.tests.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/delivery-continuation.tests.ps1

      - name: source layout and package tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: shared runtime tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: python -B -m unittest discover -s .agents/hooks/tests -p 'test_*.py' -v

      - name: selected source and package regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: python -B scripts/ci_selection.py run --group source

      - name: selected shared runtime regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: python -B scripts/ci_selection.py run --group runtime

  verify-linux:
    needs: select
    if: needs.select.outputs.plan != '' && fromJSON(needs.select.outputs.plan).mode != 'docs'
    runs-on: ubuntu-latest
    env:
      CI_SELECTION: ${{ needs.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: regenerate the workspace from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/update_catalog_digests.py
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: generated files are current
        shell: pwsh
        run: ./.agents/sync-generated.ps1 -Check

      - name: tier payloads conform to the shipped shape
        run: python -B .agents/hooks/check_tier_payload.py --root .

      - name: local capability catalog digests are current
        run: python -B scripts/update_catalog_digests.py --check

      - name: harness declarations cover authored sources
        run: python -B scripts/sync_harness_manifests.py --check

      - name: native host startup and discovery acceptance
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/tj-agents-native-acceptance"
          codex_root="$native/codex"
          archive="$native/codex.tar.gz"
          claude_root="$native/claude"
          tools="$native/tools"
          mkdir -p "$codex_root" "$claude_root" "$tools"
          python3 - "$archive" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request

          metadata = urllib.request.urlopen('https://api.github.com/repos/openai/codex/releases/tags/rust-v0.163.0-alpha.1', timeout=30)
          release = json.load(metadata)
          assets = [asset for asset in release.get('assets', []) if asset.get('name') == 'codex-x86_64-unknown-linux-musl.tar.gz']
          if len(assets) != 1 or not isinstance(assets[0].get('digest'), str):
              raise SystemExit('Codex release asset metadata is incomplete.')
          with urllib.request.urlopen(assets[0]['browser_download_url'], timeout=60) as response:
              payload = response.read()
          expected = assets[0]['digest']
          actual = 'sha256:' + hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit('Codex release asset digest does not match metadata.')
          open(sys.argv[1], 'wb').write(payload)
          PY
          tar -xzf "$archive" -C "$codex_root"
          codex_source="$(find "$codex_root" -type f -name codex-x86_64-unknown-linux-musl -perm -u+x -print -quit)"
          test -n "$codex_source"
          codex="$tools/codex"
          install -m 755 "$codex_source" "$codex"
          npm install --prefix "$claude_root" --no-audit --no-fund '@anthropic-ai/claude-code@2.1.282'
          claude_source="$(find "$claude_root/node_modules/@anthropic-ai/claude-code/bin" -type f -name claude -perm -u+x -print -quit)"
          test -n "$claude_source"
          claude="$tools/claude"
          install -m 755 "$claude_source" "$claude"
          python3 -B scripts/native_host_acceptance.py --root . --marketplace . --codex "$codex" --claude "$claude" --artifacts "$native/artifacts"

      - name: skill packaging tests
        shell: pwsh
        run: ./tests/skill-packaging.tests.ps1

      # Hook subprocesses in some tests read stdin as their payload; a closed stdin stands in for the host,
      # which always closes it, so an inherited runner stdin can never leave a hook waiting.
      - name: source layout and package tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v < /dev/null

      - name: shared runtime tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        run: python -B -m unittest discover -s .agents/hooks/tests -p 'test_*.py' -v < /dev/null

      - name: selected source and package regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: python3 -B scripts/ci_selection.py run --group source < /dev/null

      - name: selected shared runtime regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: python3 -B scripts/ci_selection.py run --group runtime < /dev/null

  ci-required:
    if: always()
    needs: [select, guard, guidance-examples, verify-windows, verify-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: require every selected validation job
        env:
          CI_SELECTION: ${{ needs.select.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci_selection.py required

  regenerate:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: regenerate-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: regenerate committed packages from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/update_catalog_digests.py
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify the regenerated tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .agents/hooks/check_tier_payload.py --root .
          python -B scripts/update_catalog_digests.py --check
          python -B scripts/sync_harness_manifests.py --check

      - name: commit and push the regeneration
        id: publish-packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/catalog/catalog.json plugins .agents/plugins/marketplace.json .claude-plugin/marketplace.json CAPABILITIES.md
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "Regenerate packages for $env:GITHUB_SHA"
            python -B scripts/update_catalog_digests.py --check
            git push origin HEAD:main
            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            "Generated output already current."
          }

      - name: Publish the generated package hint
        if: steps.publish-packages.outputs.changed == 'true' && vars.MACHINE_EVENTS_TOPIC != ''
        uses: tj-agents/github-actions/.github/actions/machine-events@d45d8a70dc1309ca02d304c8e3c58e493c263f89
        with:
          topic: ${{ secrets.MACHINE_EVENTS_TOPIC }}
          published: 'true'
