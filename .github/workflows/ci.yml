name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: generated files are current
        shell: pwsh
        run: ./.agents/sync-generated.ps1 -Check

      - name: CLI session recovery tests
        shell: powershell
        run: ./cli-session-recovery/tests/cli-session-vault.tests.ps1

      - name: skill packaging tests
        shell: pwsh
        run: ./tests/skill-packaging.tests.ps1

      - name: handoff launcher tests
        shell: pwsh
        run: ./tests/handoff-launchers.tests.ps1
      - name: plan artifact context and packaging tests
        shell: pwsh
        run: python -B -m unittest discover -s tests -p test_plan_artifacts.py -v
