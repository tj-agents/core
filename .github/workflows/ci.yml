name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: selection
        name: select affected validation
        run: python3 -B scripts/ci_selection.py select

  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: generated output stays out of pull requests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -B scripts/check_generated_paths.py --base "origin/${BASE_REF}"

  guidance-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: tj-agents/template
          ref: main
          path: .template
          persist-credentials: false

      - name: changed authored guidance has concrete examples (pull request)
        if: github.event_name == 'pull_request'
        run: python3 -B .template/.agents/template/utility/check/scripts/check_examples.py --root . --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --merge-base

      - name: changed authored guidance has concrete examples (default push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 -B .template/.agents/template/utility/check/scripts/check_examples.py --root . --base "${{ github.event.before }}" --head "${{ github.sha }}"

  verify-windows:
    needs: select
    if: >-
      needs.select.outputs.plan != '' && fromJSON(needs.select.outputs.plan).mode != 'docs'
      && contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: windows-latest
    env:
      CI_SELECTION: ${{ needs.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tj-agents/cli
          ref: cd8c726e2aadc321251de599b75c4e72e21cecb9
          path: .tj-cli
          persist-credentials: false
      - name: build the pinned tj_hook candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location .tj-cli
          cargo build --locked --release --bin tj_hook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $binaryDirectory = (Resolve-Path .tj-cli/target/release).Path
          $binaryName = if ($IsWindows) { 'tj_hook.exe' } else { 'tj_hook' }
          if (-not (Test-Path (Join-Path $binaryDirectory $binaryName))) {
            throw "Missing built $binaryName"
          }
          $binaryDirectory >> $env:GITHUB_PATH
      - name: install the locked Python environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked
          $pythonDirectory = Split-Path -Parent (uv run --locked python -c "import sys; print(sys.executable)")
          $pythonDirectory >> $env:GITHUB_PATH
      - uses: actions/checkout@v4
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        with:
          repository: tj-agents/template
          ref: main
          path: .template
          persist-credentials: false

      - name: regenerate the workspace from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/runtime_sources.py
          python -B scripts/update_plugin_digests.py
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: generated files are current
        shell: pwsh
        run: ./.agents/sync-generated.ps1 -Check

      - name: tier payloads conform to the shipped shape
        shell: pwsh
        run: python -B .agents/hooks/check_tier_payload.py --root .

      - name: local capability plugin digests are current
        shell: pwsh
        run: python -B scripts/update_plugin_digests.py --check

      - name: harness declarations cover authored sources
        shell: pwsh
        run: python -B scripts/sync_harness_manifests.py --check

      - name: native host startup and discovery acceptance
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: python -B scripts/ci_native_acceptance.py

      - name: upload native host diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-host-acceptance-windows
          path: ${{ runner.temp }}/tj-agents-native-acceptance/artifacts
          if-no-files-found: warn

      - name: authored skill references resolve in the public corpus
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: python -B .template/.agents/template/utility/check/scripts/check_skill_references.py --root . --source-root . --marketplace tj-agents/marketplace

      - name: PowerShell host compatibility tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: |
          ./tests/powershell-host-compat.tests.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/powershell-host-compat.tests.ps1

      - name: continuation scheduler tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: |
          ./tests/delivery-continuation.tests.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/delivery-continuation.tests.ps1

      - name: source layout and package tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: uv run --locked pytest tests -v

      - name: shared runtime tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: pwsh
        run: python -B -m unittest discover -s .agents/hooks/tests -p 'test_*.py' -v

      - name: selected source and package regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: uv run --locked python -B scripts/ci_selection.py run --group source

      - name: selected shared runtime regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: python -B scripts/ci_selection.py run --group runtime

  verify-linux:
    needs: select
    if: >-
      needs.select.outputs.plan != '' && fromJSON(needs.select.outputs.plan).mode != 'docs'
      && contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    env:
      CI_SELECTION: ${{ needs.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tj-agents/cli
          ref: cd8c726e2aadc321251de599b75c4e72e21cecb9
          path: .tj-cli
          persist-credentials: false
      - name: build the pinned tj_hook candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location .tj-cli
          cargo build --locked --release --bin tj_hook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $binaryDirectory = (Resolve-Path .tj-cli/target/release).Path
          $binaryName = if ($IsWindows) { 'tj_hook.exe' } else { 'tj_hook' }
          if (-not (Test-Path (Join-Path $binaryDirectory $binaryName))) {
            throw "Missing built $binaryName"
          }
          $binaryDirectory >> $env:GITHUB_PATH
      - name: install the locked Python environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv sync --locked
          $pythonDirectory = Split-Path -Parent (uv run --locked python -c "import sys; print(sys.executable)")
          $pythonDirectory >> $env:GITHUB_PATH

      - name: regenerate the workspace from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/runtime_sources.py
          python -B scripts/update_plugin_digests.py
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: generated files are current
        shell: pwsh
        run: ./.agents/sync-generated.ps1 -Check

      - name: tier payloads conform to the shipped shape
        run: python -B .agents/hooks/check_tier_payload.py --root .

      - name: local capability plugin digests are current
        run: python -B scripts/update_plugin_digests.py --check

      - name: harness declarations cover authored sources
        run: python -B scripts/sync_harness_manifests.py --check

      - name: native host startup and discovery acceptance
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        shell: bash
        run: python3 -B scripts/ci_native_acceptance.py

      - name: upload native host diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-host-acceptance-linux
          path: ${{ runner.temp }}/tj-agents-native-acceptance/artifacts
          if-no-files-found: warn

      # Hook subprocesses in some tests read stdin as their payload; a closed stdin stands in for the host,
      # which always closes it, so an inherited runner stdin can never leave a hook waiting.
      - name: source layout and package tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        run: uv run --locked pytest tests -v < /dev/null

      - name: shared runtime tests
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        run: python -B -m unittest discover -s .agents/hooks/tests -p 'test_*.py' -v < /dev/null

      - name: selected source and package regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: uv run --locked python -B scripts/ci_selection.py run --group source < /dev/null

      - name: selected shared runtime regressions
        if: fromJSON(needs.select.outputs.plan).mode == 'focused'
        run: python3 -B scripts/ci_selection.py run --group runtime < /dev/null

  ci-required:
    if: always()
    needs: [select, guard, guidance-examples, verify-windows, verify-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: require every selected validation job
        env:
          CI_SELECTION: ${{ needs.select.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 -B scripts/ci_selection.py required

  regenerate:
    if: github.event_name == 'push'
    runs-on: windows-latest
    environment: regenerate
    permissions:
      contents: write
    concurrency:
      group: regenerate-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.REGENERATE_DEPLOY_KEY }}

      - name: regenerate committed packages from authored sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/runtime_sources.py
          python -B scripts/update_plugin_digests.py
          ./.agents/sync-generated.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: verify the regenerated tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./.agents/sync-generated.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .agents/hooks/check_tier_payload.py --root .
          python -B scripts/update_plugin_digests.py --check
          python -B scripts/sync_harness_manifests.py --check

      - name: commit and push the regeneration
        id: publish-packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/plugins/plugins.json plugins .agents/plugins/marketplace.json .claude-plugin/marketplace.json CAPABILITIES.md
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "Regenerate packages for $env:GITHUB_SHA"
            python -B scripts/update_plugin_digests.py --check
            git push origin HEAD:main
            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            "Generated output already current."
          }

      - name: Publish the generated package hint
        if: steps.publish-packages.outputs.changed == 'true' && vars.UPDATE_TOPIC != ''
        uses: tj-agents/github-actions/.github/actions/publish-update@8d0f28a33f6340f1cfa82dfb40796473ff3a1f27
        with:
          topic: ${{ secrets.UPDATE_TOPIC }}
          published: 'true'
